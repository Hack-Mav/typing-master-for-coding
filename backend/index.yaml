# Datastore Composite Indexes Configuration
# Optimized for common query patterns

indexes:
  # Sessions by user and time
  - kind: Session
    properties:
      - name: user_id
      - name: created_at
        direction: desc

  # Sessions by user, mode, and time
  - kind: Session
    properties:
      - name: user_id
      - name: mode
      - name: created_at
        direction: desc

  # Sessions by language and time (for leaderboards)
  - kind: Session
    properties:
      - name: language_id
      - name: created_at
        direction: desc

  # Results by composite score (leaderboards)
  - kind: Result
    properties:
      - name: composite_score
        direction: desc
      - name: created_at
        direction: desc

  # Results by user and score
  - kind: Result
    properties:
      - name: user_id
      - name: composite_score
        direction: desc

  # Results by language, mode, and score (filtered leaderboards)
  - kind: Result
    properties:
      - name: language_id
      - name: mode
      - name: composite_score
        direction: desc
      - name: created_at
        direction: desc

  # Results by time window (daily/weekly/monthly leaderboards)
  - kind: Result
    properties:
      - name: language_id
      - name: created_at
        direction: desc
      - name: composite_score
        direction: desc

  # Session events by session and timestamp
  - kind: SessionEvent
    properties:
      - name: session_id
      - name: timestamp_ms

  # Session events with error flag
  - kind: SessionEvent
    properties:
      - name: session_id
      - name: error_flag
      - name: timestamp_ms

  # Lessons by language and difficulty
  - kind: Lesson
    properties:
      - name: language_id
      - name: difficulty
      - name: created_at
        direction: desc

  # Lessons by language and version
  - kind: Lesson
    properties:
      - name: language_id
      - name: version
        direction: desc

  # Snippets by language and difficulty
  - kind: Snippet
    properties:
      - name: language_id
      - name: difficulty
      - name: created_at
        direction: desc

  # Snippets by language and tags (for filtering)
  - kind: Snippet
    properties:
      - name: language_id
      - name: tags
      - name: difficulty

  # User progress by user and lesson
  - kind: UserProgress
    properties:
      - name: user_id
      - name: lesson_id
      - name: updated_at
        direction: desc

  # User progress by completion status
  - kind: UserProgress
    properties:
      - name: user_id
      - name: completed
      - name: updated_at
        direction: desc

  # Leaderboard entries by time window
  - kind: LeaderboardEntry
    properties:
      - name: language_id
      - name: mode
      - name: time_window
      - name: score
        direction: desc

  # Leaderboard entries by organization
  - kind: LeaderboardEntry
    properties:
      - name: organization_id
      - name: language_id
      - name: score
        direction: desc

  # Anti-cheat flags by user and timestamp
  - kind: AntiCheatFlag
    properties:
      - name: user_id
      - name: flagged_at
        direction: desc

  # Anti-cheat flags by severity
  - kind: AntiCheatFlag
    properties:
      - name: severity
      - name: flagged_at
        direction: desc

  # Content analytics by content type and date
  - kind: ContentAnalytics
    properties:
      - name: content_type
      - name: content_id
      - name: date
        direction: desc

  # User sessions for analytics
  - kind: UserSession
    properties:
      - name: user_id
      - name: started_at
        direction: desc

  # User sessions by device type
  - kind: UserSession
    properties:
      - name: device_type
      - name: started_at
        direction: desc
