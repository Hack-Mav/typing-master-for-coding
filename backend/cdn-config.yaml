# Google Cloud CDN Configuration
# This file documents the CDN setup steps

# 1. Create a Cloud Storage bucket for static assets
# gsutil mb -p typing-master-prod -c STANDARD -l us-central1 gs://typing-master-static

# 2. Make bucket publicly readable
# gsutil iam ch allUsers:objectViewer gs://typing-master-static

# 3. Set CORS configuration
# gsutil cors set cors.json gs://typing-master-static

# 4. Create backend bucket
# gcloud compute backend-buckets create typing-master-static-backend \
#   --gcs-bucket-name=typing-master-static \
#   --enable-cdn \
#   --cache-mode=CACHE_ALL_STATIC

# 5. Create URL map
# gcloud compute url-maps create typing-master-cdn \
#   --default-backend-bucket=typing-master-static-backend

# 6. Create SSL certificate
# gcloud compute ssl-certificates create typing-master-ssl \
#   --domains=typing-master.app,www.typing-master.app

# 7. Create HTTPS proxy
# gcloud compute target-https-proxies create typing-master-https-proxy \
#   --url-map=typing-master-cdn \
#   --ssl-certificates=typing-master-ssl

# 8. Create forwarding rule
# gcloud compute forwarding-rules create typing-master-https-rule \
#   --global \
#   --target-https-proxy=typing-master-https-proxy \
#   --ports=443

# CDN Cache Settings
cdn_policy:
  cache_mode: CACHE_ALL_STATIC
  default_ttl: 3600  # 1 hour
  max_ttl: 86400     # 24 hours
  client_ttl: 3600   # 1 hour
  negative_caching: true
  negative_caching_policy:
    - code: 404
      ttl: 300  # 5 minutes
    - code: 500
      ttl: 0    # Don't cache errors
  
  # Cache key policy
  cache_key_policy:
    include_host: true
    include_protocol: true
    include_query_string: false
    query_string_whitelist:
      - v  # Version parameter for cache busting

# Custom headers for CDN
custom_response_headers:
  - "Cache-Control: public, max-age=31536000, immutable"
  - "X-Content-Type-Options: nosniff"
  - "X-Frame-Options: DENY"
  - "X-XSS-Protection: 1; mode=block"
  - "Strict-Transport-Security: max-age=31536000; includeSubDomains"

# Asset types and cache durations
asset_cache_rules:
  # WASM parsers - long cache (immutable)
  - pattern: "*.wasm"
    cache_control: "public, max-age=31536000, immutable"
    
  # JavaScript bundles - long cache with version
  - pattern: "*.js"
    cache_control: "public, max-age=31536000, immutable"
    
  # CSS files - long cache with version
  - pattern: "*.css"
    cache_control: "public, max-age=31536000, immutable"
    
  # Images - long cache
  - pattern: "*.{png,jpg,jpeg,gif,svg,webp,ico}"
    cache_control: "public, max-age=31536000, immutable"
    
  # Fonts - long cache
  - pattern: "*.{woff,woff2,ttf,eot}"
    cache_control: "public, max-age=31536000, immutable"
    
  # HTML - short cache
  - pattern: "*.html"
    cache_control: "public, max-age=300, must-revalidate"
    
  # Service worker - no cache
  - pattern: "service-worker.js"
    cache_control: "no-cache, no-store, must-revalidate"
