runtime: go121

# Production App Engine Configuration
service: default

# Automatic scaling configuration for production
automatic_scaling:
  min_instances: 2
  max_instances: 50
  target_cpu_utilization: 0.65
  target_throughput_utilization: 0.65
  min_pending_latency: 30ms
  max_pending_latency: 100ms
  max_concurrent_requests: 80

# Environment variables for production
env_variables:
  ENVIRONMENT: production
  GOOGLE_CLOUD_PROJECT: typing-master-prod
  # JWT_SECRET should be set via Secret Manager
  ALLOWED_ORIGINS: https://typing-master.app,https://www.typing-master.app
  CACHE_MAX_SIZE: 50000
  CACHE_TTL_MINUTES: 60
  ENABLE_TELEMETRY: true
  TELEMETRY_ENDPOINT: opentelemetry-collector:4317
  LOG_LEVEL: info
  RATE_LIMIT_REQUESTS: 1000
  RATE_LIMIT_WINDOW: 60
  SESSION_BATCH_SIZE: 100
  SESSION_FLUSH_INTERVAL: 30

# Resource limits for production
resources:
  cpu: 2
  memory_gb: 2
  disk_size_gb: 20

# Health check configuration
readiness_check:
  path: "/health"
  check_interval_sec: 5
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2
  app_start_timeout_sec: 300

liveness_check:
  path: "/health"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 4
  success_threshold: 2

# Network settings
network:
  forwarded_ports:
    - 8080
  session_affinity: true

# Handlers configuration
handlers:
# Static files with CDN caching
- url: /static
  static_dir: static
  secure: always
  redirect_http_response_code: 301
  http_headers:
    Cache-Control: "public, max-age=31536000, immutable"
    X-Content-Type-Options: "nosniff"
    X-Frame-Options: "DENY"
    X-XSS-Protection: "1; mode=block"

# API endpoints
- url: /.*
  script: auto
  secure: always
  redirect_http_response_code: 301

# VPC connector for private resources (optional)
# vpc_access_connector:
#   name: projects/typing-master-prod/locations/us-central1/connectors/typing-master-connector

# Entrypoint
entrypoint: ./typing-master-for-coding/backend

# Build configuration
build_env_variables:
  CGO_ENABLED: "0"
  GOOS: "linux"
  GOARCH: "amd64"
