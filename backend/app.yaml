runtime: go121

# App Engine Standard Environment Configuration
service: default

# Automatic scaling configuration
automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.6
  target_throughput_utilization: 0.6

# Environment variables
env_variables:
  ENVIRONMENT: production
  GOOGLE_CLOUD_PROJECT: typing-master-prod
  JWT_SECRET: your-production-jwt-secret-change-this
  ALLOWED_ORIGINS: https://typing-master.app,https://www.typing-master.app
  CACHE_MAX_SIZE: 10000
  CACHE_TTL_MINUTES: 30

# Resource limits
resources:
  cpu: 1
  memory_gb: 0.5
  disk_size_gb: 10

# Health check configuration
readiness_check:
  path: "/health"
  check_interval_sec: 5
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2
  app_start_timeout_sec: 300

liveness_check:
  path: "/health"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 4
  success_threshold: 2

# Network settings
network:
  forwarded_ports:
    - 8080

# Handlers for static files (if needed)
handlers:
- url: /.*
  script: auto
  secure: always
  redirect_http_response_code: 301