runtime: go121

# Development App Engine Configuration
service: default

# Manual scaling for development
manual_scaling:
  instances: 1

# Environment variables for development
env_variables:
  ENVIRONMENT: development
  GOOGLE_CLOUD_PROJECT: typing-master-dev
  JWT_SECRET: dev-jwt-secret-not-for-production
  ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
  CACHE_MAX_SIZE: 1000
  CACHE_TTL_MINUTES: 15

# Resource limits for development
resources:
  cpu: 1
  memory_gb: 0.5

# Health check configuration
readiness_check:
  path: "/health"
  check_interval_sec: 5
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2

liveness_check:
  path: "/health"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 4
  success_threshold: 2